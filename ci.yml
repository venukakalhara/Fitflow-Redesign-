name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint and test (runs once requirements exist)
        run: |
          for d in backend ai-service; do
            if [ -f "$d/requirements.txt" ]; then
              pip install -r "$d/requirements.txt" ruff pytest
              ruff check "$d"
              pytest "$d" || [ $? -eq 5 ]
            fi
          done
